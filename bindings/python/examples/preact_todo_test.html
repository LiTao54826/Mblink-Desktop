<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Preact 待办事项测试</title>
</head>
<body>
    <!-- Preact 会在这里渲染 -->
    
    <script src="../../../js/preact/preact.js"></script>
    <script src="../../../js/preact/hooks.js"></script>
    
    <script>
        // 模拟 host.call() API
        window.host = {
            call: function(funcName, args) {
                console.log('host.call:', funcName, args);
                
                // 模拟数据
                const mockTodos = [
                    { id: 1, text: '学习 Preact', completed: false, createdAt: new Date().toISOString() },
                    { id: 2, text: '构建待办应用', completed: true, createdAt: new Date().toISOString() },
                    { id: 3, text: '测试 Python 绑定', completed: false, createdAt: new Date().toISOString() }
                ];
                
                switch(funcName) {
                    case 'getTodos':
                        return mockTodos;
                    
                    case 'getStats':
                        const total = mockTodos.length;
                        const completed = mockTodos.filter(t => t.completed).length;
                        const active = total - completed;
                        return {
                            total: total,
                            completed: completed,
                            active: active,
                            completionRate: total > 0 ? Math.round(completed / total * 100) : 0
                        };
                    
                    case 'addTodo':
                        const newTodo = {
                            id: mockTodos.length + 1,
                            text: args,
                            completed: false,
                            createdAt: new Date().toISOString()
                        };
                        mockTodos.push(newTodo);
                        return { success: true, todo: newTodo };
                    
                    case 'toggleTodo':
                        const toggleTodo = mockTodos.find(t => t.id === args);
                        if (toggleTodo) {
                            toggleTodo.completed = !toggleTodo.completed;
                        }
                        return { success: true, todos: mockTodos };
                    
                    case 'deleteTodo':
                        const index = mockTodos.findIndex(t => t.id === args);
                        if (index !== -1) {
                            mockTodos.splice(index, 1);
                        }
                        return { success: true, todos: mockTodos };
                    
                    case 'editTodo':
                        const editTodo = mockTodos.find(t => t.id === args.id);
                        if (editTodo) {
                            editTodo.text = args.text;
                        }
                        return { success: true, todos: mockTodos };
                    
                    case 'clearCompleted':
                        for (let i = mockTodos.length - 1; i >= 0; i--) {
                            if (mockTodos[i].completed) {
                                mockTodos.splice(i, 1);
                            }
                        }
                        return { success: true, todos: mockTodos };
                    
                    default:
                        console.warn('Unknown function:', funcName);
                        return null;
                }
            }
        };
    </script>
    
    <!-- 加载 Preact 待办应用 -->
    <script src="preact_todo_app.js"></script>
</body>
</html>
