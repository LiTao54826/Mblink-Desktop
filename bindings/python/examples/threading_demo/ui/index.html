<!DOCTYPE html>
<html>

<head>
    <meta charset='utf-8'>
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #0f172a;
            color: #e2e8f0;
            font-family: Segoe UI, Arial, sans-serif;
        }

        body {
            overflow: hidden;
        }

        .wrap {
            display: grid;
            grid-template-columns: 320px minmax(0, 1fr);
            gap: 12px;
            width: 100vw;
            height: 100vh;
            padding: 12px;
        }

        .panel,
        .right,
        .pane,
        .pane-body,
        #logs,
        #term {
            min-width: 0;
            min-height: 0;
        }

        .panel {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 16px;
            background: #111827;
            border: 1px solid #334155;
            border-radius: 12px;
        }

        .title {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .title h3 {
            margin: 0;
            font-size: 18px;
        }

        .title p {
            margin: 0;
            color: #94a3b8;
            line-height: 1.5;
            font-size: 13px;
        }

        .actions {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 8px;
        }

        button {
            border: 0;
            border-radius: 8px;
            padding: 10px 12px;
            background: #2563eb;
            color: #fff;
            cursor: pointer;
        }

        .danger {
            background: #dc2626;
        }

        .status {
            flex: 1;
            white-space: pre-wrap;
            font: 12px Consolas, monospace;
            line-height: 1.6;
            padding: 12px;
            border: 1px solid #223047;
            background: #0b1220;
            border-radius: 8px;
            overflow: auto;
        }

        .right {
            display: grid;
            grid-template-rows: minmax(0, 1fr) minmax(0, 1fr);
            gap: 12px;
        }

        .pane {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .pane-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4px;
            color: #94a3b8;
            font-size: 12px;
            letter-spacing: .04em;
            text-transform: uppercase;
        }

        .pane-body {
            flex: 1;
            border: 1px solid #334155;
            border-radius: 10px;
            overflow: hidden;
            background: #020617;
        }

        #logs,
        #term {
            display: block;
            width: 100%;
            height: 100%;
        }

        @media (max-width: 980px) {
            .wrap {
                grid-template-columns: 1fr;
                grid-template-rows: auto minmax(0, 1fr);
            }

            .panel {
                min-height: auto;
            }
        }
    </style>
</head>

<body>
    <div class='wrap'>
        <div class='panel'>
            <div class='title'>
                <h3>多线程调用示例</h3>
                <p>后台线程会并发更新 SharedState、LogView、Terminal。</p>
            </div>
            <div class='actions'>
                <button id='start'>启动线程</button>
                <button id='stop' class='danger'>停止线程</button>
            </div>
            <div id='status' class='status'></div>
        </div>
        <div class='right'>
            <section class='pane'>
                <div class='pane-head'><span>Logs</span></div>
                <div class='pane-body'>
                    <logview id='logs'></logview>
                </div>
            </section>
            <section class='pane'>
                <div class='pane-head'><span>Terminal</span></div>
                <div class='pane-body'>
                    <terminal id='term'></terminal>
                </div>
            </section>
        </div>
    </div>
    <script>
        const box = document.getElementById('status');
        function render() {
            box.textContent = `running: ${demo.running}
workers: ${demo.worker_count}
ticks: ${demo.tick}
last_worker: ${demo.last_worker}
last_value: ${demo.last_value}
last_log: ${demo.last_log}`;
        }

        document.getElementById('start').onclick = () => backend.start_workers();
        document.getElementById('stop').onclick = () => backend.stop_workers();
    </script>
</body>

</html>
