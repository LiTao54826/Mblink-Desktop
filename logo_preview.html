<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MBink Logo Options</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #1a1a1a;
            color: #f0f0f0;
            transition: background-color 0.3s;
        }
        .header {
            text-align: center;
            margin-bottom: 40px;
        }
        h1 {
            font-weight: 200;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }
        .container {
            display: flex;
            gap: 40px;
            padding: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .card {
            text-align: center;
            padding: 20px;
            border-radius: 16px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s;
            width: 250px;
        }
        .card:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.08);
        }
        .logo-box {
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        img {
            max-width: 100%;
            max-height: 100%;
            filter: drop-shadow(0 0 10px rgba(0,0,0,0.2));
        }
        h2 {
            font-weight: 300;
            font-size: 1.2rem;
            margin: 10px 0;
        }
        p {
            color: #888;
            font-size: 0.9em;
            line-height: 1.4;
        }
        .light-mode {
            background-color: #f5f5f7;
            color: #1d1d1f;
        }
        .light-mode .card {
            background: rgba(0, 0, 0, 0.03);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            background: #007AFF;
            color: white;
            font-size: 1rem;
            margin-top: 20px;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>MBink Logo Concepts</h1>
        <p>Lightweight Enterprise Desktop Framework</p>
        <button onclick="document.body.classList.toggle('light-mode')">Toggle Theme</button>
    </div>

    <div class="container">
        <!-- Option 1 -->
        <div class="card">
            <div class="logo-box">
                <img src="logo.svg" alt="Digital Ink">
            </div>
            <h2>Option 1: Digital Ink</h2>
            <p>Fluid ink meets pixel precision. The perfect hybrid.</p>
        </div>

        <!-- Option 2 -->
        <div class="card">
            <div class="logo-box">
                <img src="logo_v2.svg" alt="Swift Feather">
            </div>
            <h2>Option 2: Swift Feather</h2>
            <p>Speed, agility, and lightweight performance.</p>
        </div>

        <!-- Option 3 -->
        <div class="card">
            <div class="logo-box">
                <img src="logo_v3.svg" alt="Core Box">
            </div>
            <h2>Option 3: Core Box</h2>
            <p>The stable container for your enterprise apps.</p>
        </div>
    </div>
</body>
</html>
