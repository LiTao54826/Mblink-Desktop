<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="coreBoxGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8E2DE2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4A00E0;stop-opacity:1" />
    </linearGradient>
    <filter id="innerGlow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feComposite in="SourceGraphic" in2="coloredBlur" operator="arithmetic" k2="1" k3="1"/>
    </filter>
  </defs>
  
  <!-- Isometric Cube Base -->
  <path d="M 50 20 L 85 40 L 85 80 L 50 100 L 15 80 L 15 40 Z" fill="#1e1e24" stroke="#8E2DE2" stroke-width="2"/>
  
  <!-- Top Face -->
  <path d="M 50 20 L 85 40 L 50 60 L 15 40 Z" fill="#2d2d35" opacity="0.8"/>
  
  <!-- Right Face -->
  <path d="M 85 40 L 85 80 L 50 100 L 50 60 Z" fill="#25252c" opacity="0.6"/>
  
  <!-- Left Face -->
  <path d="M 15 40 L 50 60 L 50 100 L 15 80 Z" fill="#25252c" opacity="0.4"/>
  
  <!-- Glowing Ink Drop Inside -->
  <path d="M 50 35 Q 35 60 35 70 A 15 15 0 1 0 65 70 Q 65 60 50 35" fill="url(#coreBoxGradient)" filter="url(#innerGlow)" opacity="0.9"/>
  
  <!-- M Shape Cutout Negative Space -->
  <!-- <path d="M 35 70 L 35 55 L 50 65 L 65 55 L 65 70" stroke="#FFF" stroke-width="2" fill="none" opacity="0.5"/> -->
</svg>
