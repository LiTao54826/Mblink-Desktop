<!DOCTYPE html>
<html>
<head>
    <title>MBink Window Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
        }
        .container {
            max-width: 760px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 {
            color: #667eea;
            margin-top: 0;
            text-align: center;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 5px;
        }
        .section h2 {
            margin-top: 0;
            color: #495057;
            font-size: 18px;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .btn-primary {
            background: #667eea;
            color: white;
        }
        .btn-primary:hover {
            background: #5568d3;
        }
        .btn-success {
            background: #51cf66;
            color: white;
        }
        .btn-danger {
            background: #ff6b6b;
            color: white;
        }
        input[type="text"], input[type="password"], textarea, select {
            padding: 8px;
            margin: 5px;
            border: 1px solid #ced4da;
            border-radius: 4px;
            font-size: 14px;
        }
        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        .counter {
            font-size: 48px;
            font-weight: bold;
            color: #667eea;
            text-align: center;
            margin: 20px 0;
        }
        .output {
            padding: 10px;
            background: #e9ecef;
            border-radius: 4px;
            margin: 10px 0;
            font-family: monospace;
            min-height: 20px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin: 10px 0;
        }
        th, td {
            padding: 8px;
            text-align: left;
            border-bottom: 1px solid #dee2e6;
        }
        th {
            background: #667eea;
            color: white;
        }
        .footer {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #dee2e6;
            color: #6c757d;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>MBink Window Demo</h1>

        <!-- 计数器示例 -->
        <div class="section">
            <h2>Interactive Counter</h2>
            <div class="counter" id="counter">0</div>
            <div style="text-align: center;">
                <button class="btn-primary" id="incrementBtn">+ Increment</button>
                <button class="btn-danger" id="decrementBtn">- Decrement</button>
                <button class="btn-success" id="resetBtn">Reset</button>
            </div>
        </div>

        <!-- 表单示例 -->
        <div class="section">
            <h2>Form Elements</h2>
            <div>
                <input type="text" id="nameInput" placeholder="Enter your name" style="width: 200px;">
                <button class="btn-primary" id="greetBtn">Greet</button>
            </div>
            <div class="output" id="greeting"></div>
        </div>

        <!-- 列表示例 -->
        <div class="section">
            <h2>Todo List</h2>
            <div>
                <input type="text" id="todoInput" placeholder="New todo item" style="width: 300px;">
                <button class="btn-success" id="addTodoBtn">+ Add</button>
            </div>
            <ul id="todoList" style="list-style: none; padding: 0;"></ul>
        </div>

        <!-- 定时器示例 -->
        <div class="section">
            <h2>Timer</h2>
            <div class="output" id="timer">Timer: 0s</div>
            <button class="btn-primary" id="timerBtn">Start</button>
        </div>
        
        <!-- 元素展示 -->
        <div class="section">
            <h2>UI Elements</h2>
            <table>
                <tr>
                    <th>Element</th>
                    <th>Example</th>
                </tr>
                <tr>
                    <td>Checkbox</td>
                    <td><input type="checkbox" checked> Option 1 <input type="checkbox"> Option 2</td>
                </tr>
                <tr>
                    <td>Radio</td>
                    <td><input type="radio" name="r1" checked> Choice A <input type="radio" name="r1"> Choice B</td>
                </tr>
                <tr>
                    <td>Select</td>
                    <td>
                        <select>
                            <option>Option 1</option>
                            <option selected>Option 2</option>
                            <option>Option 3</option>
                        </select>
                    </td>
                </tr>
            </table>
        </div>
        
        <div class="footer">
            MBink Framework v1.0 | Powered by QuickJS, Skia & SDL3
        </div>
    </div>
    
    <script src="examples/window_demo/app.js"></script>
</body>
</html>
