<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f0f0f0;
            font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
        }

        h1 {
            color: #333;
            text-align: center;
        }

        /* Grid Container 1: Basic 2x2 Grid */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto auto;
            gap: 10px;
            background: #667eea;
            border-radius: 8px;
            padding: 20px;
            margin: 10px 0;
        }

        /* Grid Container 2: 3 Columns with Different Sizes */
        .grid-three-col {
            display: grid;
            grid-template-columns: 100px 1fr 2fr;
            gap: 15px;
            background: #51cf66;
            border-radius: 8px;
            padding: 20px;
            margin: 10px 0;
        }

        /* Grid Container 3: Auto-flow */
        .grid-auto {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            grid-auto-flow: row;
            gap: 10px;
            background: #ff6b6b;
            border-radius: 8px;
            padding: 20px;
            margin: 10px 0;
        }

        .grid-item {
            background: white;
            border-radius: 4px;
            padding: 20px;
            color: #333;
            font-size: 16px;
            text-align: center;
        }

        /* Spanning items */
        .span-2-col {
            grid-column: span 2;
        }

        .span-2-row {
            grid-row: span 2;
        }
    </style>
</head>
<body>
    <h1>CSS Grid Layout Test</h1>

    <!-- Basic 2x2 Grid -->
    <div class="grid-container">
        <div class="grid-item">Item 1</div>
        <div class="grid-item">Item 2</div>
        <div class="grid-item">Item 3</div>
        <div class="grid-item">Item 4</div>
    </div>

    <!-- 3 Columns with Different Sizes -->
    <div class="grid-three-col">
        <div class="grid-item">100px</div>
        <div class="grid-item">1fr</div>
        <div class="grid-item">2fr</div>
    </div>

    <!-- Auto-flow with Spanning -->
    <div class="grid-auto">
        <div class="grid-item span-2-col">Span 2 Columns</div>
        <div class="grid-item">Item 2</div>
        <div class="grid-item">Item 3</div>
        <div class="grid-item">Item 4</div>
        <div class="grid-item">Item 5</div>
    </div>
</body>
</html>
