<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Layout Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f0f0f0;
        }
        
        .flex-container {
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            background: #667eea;
            padding: 20px;
            margin: 10px 0;
            border-radius: 8px;
        }
        
        .flex-item {
            background: white;
            padding: 20px;
            margin: 5px;
            border-radius: 4px;
            color: #333;
            font-size: 16px;
        }
        
        .column-container {
            display: flex;
            flex-direction: column;
            background: #51cf66;
            padding: 20px;
            margin: 10px 0;
            border-radius: 8px;
        }
        
        .wrap-container {
            display: flex;
            flex-wrap: wrap;
            background: #ff6b6b;
            padding: 20px;
            margin: 10px 0;
            border-radius: 8px;
        }
        
        h1 {
            color: #333;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Flexbox Layout Test</h1>
    
    <div class="flex-container">
        <div class="flex-item">Item 1</div>
        <div class="flex-item">Item 2</div>
        <div class="flex-item">Item 3</div>
    </div>
    
    <div class="column-container">
        <div class="flex-item">Column Item 1</div>
        <div class="flex-item">Column Item 2</div>
        <div class="flex-item">Column Item 3</div>
    </div>
    
    <div class="wrap-container">
        <div class="flex-item">Wrap 1</div>
        <div class="flex-item">Wrap 2</div>
        <div class="flex-item">Wrap 3</div>
        <div class="flex-item">Wrap 4</div>
        <div class="flex-item">Wrap 5</div>
    </div>
</body>
</html>
