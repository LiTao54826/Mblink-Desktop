<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>调试编辑器 - 浏览器测试</title>
  <style>
    body {
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    .editor {
      padding: 10px;
      min-height: 100px;
      margin-bottom: 20px;
    }
    .editor:focus {
      outline: 2px solid #007bff;
    }
  </style>
</head>
<body>
  <h1>调试编辑器</h1>
  
  <h3>测试 1: dangerouslySetInnerHTML + contentEditable</h3>
  <div id="editor1" contenteditable="true" class="editor" style="border: 2px solid blue;">
    <p>这是通过 dangerouslySetInnerHTML 设置的内容</p>
    <p><strong>粗体</strong> 和 <em>斜体</em></p>
  </div>
  
  <h3>测试 2: 直接子元素 + contentEditable</h3>
  <div id="editor2" contenteditable="true" class="editor" style="border: 2px solid green;">
    <p>这是直接作为子元素的内容</p>
    <p><strong>粗体</strong> 和 <em>斜体</em></p>
  </div>
  
  <h3>测试 3: 纯文本 + contentEditable</h3>
  <div id="editor3" contenteditable="true" class="editor" style="border: 2px solid red;">
    这是纯文本内容，可以编辑
  </div>

  <h3>调试信息</h3>
  <div id="debug" style="background: #f0f0f0; padding: 10px; font-family: monospace; white-space: pre-wrap;"></div>

  <script>
    const debugDiv = document.getElementById('debug');
    
    function log(msg) {
      debugDiv.textContent += msg + '\n';
      console.log(msg);
    }

    // 监听所有编辑器的事件
    ['editor1', 'editor2', 'editor3'].forEach(id => {
      const editor = document.getElementById(id);
      
      editor.addEventListener('focus', () => {
        log(`[${id}] focus`);
        log(`  Selection: ${window.getSelection()}`);
      });

      editor.addEventListener('click', (e) => {
        log(`[${id}] click on ${e.target.nodeName}`);
        const sel = window.getSelection();
        if (sel.rangeCount > 0) {
          const range = sel.getRangeAt(0);
          log(`  anchorNode: ${sel.anchorNode?.nodeName}, offset: ${sel.anchorOffset}`);
          log(`  focusNode: ${sel.focusNode?.nodeName}, offset: ${sel.focusOffset}`);
        }
      });

      editor.addEventListener('keydown', (e) => {
        log(`[${id}] keydown: ${e.key} (code: ${e.keyCode})`);
      });

      editor.addEventListener('input', (e) => {
        log(`[${id}] input: inputType=${e.inputType}, data=${e.data}`);
      });

      editor.addEventListener('beforeinput', (e) => {
        log(`[${id}] beforeinput: inputType=${e.inputType}, data=${e.data}`);
      });
    });

    log('=== 调试编辑器已加载 ===');
    log('点击编辑器查看 Selection 信息');
    log('输入文字查看 input 事件');
    log('按 Backspace/Delete 测试删除');
  </script>
</body>
</html>
