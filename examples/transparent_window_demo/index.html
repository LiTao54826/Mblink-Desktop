<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transparent Window Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html,
    body {
      width: 100%;
      height: 100%;
      background: #f8fafc;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .pet-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-start;
      padding: 40px;
    }

    .bubble {
      width: 260px;
      min-height: 180px;
      background: rgba(102, 126, 234, 0.94);
      border-radius: 32px;
      box-shadow: 0 18px 45px rgba(79, 70, 229, 0.32);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      position: relative;
      text-align: center;
      -webkit-app-region: drag;
    }

    .bubble-tail {
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-top: 30px solid rgba(102, 126, 234, 0.94);
    }

    .bubble h2 {
      font-size: 22px;
      line-height: 1.2;
      margin-bottom: 10px;
    }

    .bubble p {
      max-width: 200px;
      font-size: 13px;
      line-height: 1.45;
      opacity: 0.86;
    }

    .close-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(255, 95, 87, 0.92);
      color: white;
      font-size: 14px;
      line-height: 24px;
      cursor: pointer;
      -webkit-app-region: no-drag;
      -webkit-window-control: close;
    }

    .status {
      margin-top: 14px;
      font-size: 11px;
      opacity: 0.68;
    }
  </style>
</head>
<body>
  <div class="pet-container">
    <div class="bubble">
      <div class="close-btn">x</div>
      <h2>Transparent Bubble</h2>
      <p>Drag this compact transparent-window demo around the desktop.</p>
      <div class="status">MBink Transparent Window</div>
    </div>
    <div class="bubble-tail"></div>
  </div>
</body>
</html>
