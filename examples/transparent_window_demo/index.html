<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>Transparent Window Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%; height: 100%;
      background: transparent;
      overflow: hidden;
    }

    .pet-container {
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* 不规则窗口主体 - 用 CSS 画一个可爱的圆形气泡 */
    .bubble {
      width: 280px;
      height: 200px;
      background: rgba(102, 126, 234, 0.92);
      border-radius: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: white;
      position: relative;
      -webkit-app-region: drag;
    }

    /* 气泡尾巴 */
    .bubble-tail {
      width: 0;
      height: 0;
      border-left: 20px solid transparent;
      border-right: 20px solid transparent;
      border-top: 30px solid rgba(102, 126, 234, 0.92);
    }

    .bubble h2 {
      font-size: 20px;
      margin-bottom: 8px;
    }

    .bubble p {
      font-size: 13px;
      opacity: 0.85;
      text-align: center;
      padding: 0 20px;
    }

    /* 关闭按钮 */
    .close-btn {
      position: absolute;
      top: 10px;
      right: 14px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(255, 95, 87, 0.9);
      color: white;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      -webkit-app-region: no-drag;
      -webkit-window-control: close;
    }

    .status {
      margin-top: 12px;
      font-size: 11px;
      opacity: 0.6;
    }
  </style>
</head>
<body>
  <div class="pet-container">
    <div class="bubble">
      <div class="close-btn">✕</div>
      <h2>🐱 喵~</h2>
      <p>我是一个透明不规则窗口！拖我试试~</p>
      <div class="status">LightUI Transparent Window</div>
    </div>
    <div class="bubble-tail"></div>
  </div>
</body>
</html>
