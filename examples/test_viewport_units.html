<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Viewport Units Test</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <!-- 
        视口单位测试页面
        
        此页面用于测试 vh, vw, vmin, vmax 单位是否正确工作。
        
        测试用例:
        1. height: 100vh - 应该等于视口高度
        2. height: 50vh - 应该等于视口高度的一半
        3. width: 100vw - 应该等于视口宽度
        4. width: 50vw - 应该等于视口宽度的一半
        
        在 DevTools 中检查元素的计算样式以验证值是否正确。
    -->
    
    <!-- 测试 1: 100vh 高度 -->
    <div id="test-100vh" style="
        height: 100vh;
        width: 200px;
        background-color: rgba(255, 0, 0, 0.3);
        position: absolute;
        top: 0;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    ">
        <span style="color: white; font-weight: bold;">100vh</span>
    </div>
    
    <!-- 测试 2: 50vh 高度 -->
    <div id="test-50vh" style="
        height: 50vh;
        width: 200px;
        background-color: rgba(0, 255, 0, 0.3);
        position: absolute;
        top: 0;
        left: 220px;
        display: flex;
        align-items: center;
        justify-content: center;
    ">
        <span style="color: white; font-weight: bold;">50vh</span>
    </div>
    
    <!-- 测试 3: 100vw 宽度 -->
    <div id="test-100vw" style="
        height: 50px;
        width: 100vw;
        background-color: rgba(0, 0, 255, 0.3);
        position: absolute;
        bottom: 100px;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    ">
        <span style="color: white; font-weight: bold;">100vw</span>
    </div>
    
    <!-- 测试 4: 50vw 宽度 -->
    <div id="test-50vw" style="
        height: 50px;
        width: 50vw;
        background-color: rgba(255, 255, 0, 0.5);
        position: absolute;
        bottom: 40px;
        left: 0;
        display: flex;
        align-items: center;
        justify-content: center;
    ">
        <span style="font-weight: bold;">50vw</span>
    </div>
    
    <!-- 测试 5: vmin 单位 -->
    <div id="test-vmin" style="
        height: 20vmin;
        width: 20vmin;
        background-color: rgba(128, 0, 128, 0.5);
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
    ">
        <span style="color: white; font-weight: bold;">20vmin</span>
    </div>
    
    <!-- 信息面板 -->
    <div style="
        position: absolute;
        top: 10px;
        right: 10px;
        padding: 15px;
        background-color: white;
        border: 1px solid #ccc;
        border-radius: 5px;
        font-size: 14px;
        font-family: Arial, sans-serif;
    ">
        <h3 style="margin: 0 0 10px 0;">视口单位测试</h3>
        <p style="margin: 5px 0;">红色: height: 100vh</p>
        <p style="margin: 5px 0;">绿色: height: 50vh</p>
        <p style="margin: 5px 0;">蓝色: width: 100vw</p>
        <p style="margin: 5px 0;">黄色: width: 50vw</p>
        <p style="margin: 5px 0;">紫色: 20vmin x 20vmin</p>
        <hr style="margin: 10px 0;">
        <p style="margin: 5px 0; font-size: 12px; color: #666;">
            检查控制台输出以查看调试日志
        </p>
    </div>
</body>
</html>
