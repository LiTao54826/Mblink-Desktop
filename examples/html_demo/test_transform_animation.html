<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>CSS 动画测试 - 浏览器版本</title>
    <style>
        /* 淡入动画 */
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* 滑入动画 */
        @keyframes slideIn {
            0% { transform: translateX(-100px); opacity: 0; }
            100% { transform: translateX(0px); opacity: 1; }
        }

        /* 弹跳动画 */
        @keyframes bounce {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-30px); }
        }

        /* 旋转动画 */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* 缩放动画 */
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.2); }
        }

        /* 颜色渐变动画 */
        @keyframes colorChange {
            0% { background-color: rgb(255, 100, 100); }
            33% { background-color: rgb(100, 255, 100); }
            66% { background-color: rgb(100, 100, 255); }
            100% { background-color: rgb(255, 100, 100); }
        }

        .container {
            padding: 20px;
            font-family: sans-serif;
        }

        .demo-box {
            width: 100px;
            height: 100px;
            margin: 20px;
            display: inline-block;
            border-radius: 8px;
            text-align: center;
            line-height: 100px;
            color: white;
            font-weight: bold;
        }

        .fade-in {
            background: #3498db;
            animation: fadeIn 2s ease-in-out;
        }

        .slide-in {
            background: #e74c3c;
            animation: slideIn 1s ease-out;
        }

        .bounce {
            background: #2ecc71;
            animation: bounce 1s ease-in-out infinite;
        }

        .spin {
            background: #9b59b6;
            animation: spin 2s linear infinite;
        }

        .pulse {
            background: #f39c12;
            animation: pulse 1s ease-in-out infinite;
        }

        .color-change {
            animation: colorChange 3s linear infinite;
        }

        .controls {
            margin: 20px;
            padding: 15px;
            background: #ecf0f1;
            border-radius: 8px;
        }

        .btn {
            padding: 10px 20px;
            margin: 5px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .controllable-box {
            width: 150px;
            height: 150px;
            background: #1abc9c;
            border-radius: 8px;
            margin: 20px auto;
            animation: bounce 1s ease-in-out infinite;
        }

        .controllable-box.paused {
            animation-play-state: paused;
        }

        .fill-box {
            width: 80px;
            height: 80px;
            margin: 10px;
            display: inline-block;
            font-size: 12px;
            color: white;
            text-align: center;
            line-height: 80px;
        }

        .fill-forwards {
            background: #e74c3c;
            animation: slideIn 1s ease-out forwards;
        }

        .fill-backwards {
            background: #3498db;
            animation: fadeIn 1s ease-out 1s backwards;
        }

        .fill-both {
            background: #2ecc71;
            animation: slideIn 1s ease-out 0.5s both;
        }

        .multi-box {
            width: 120px;
            height: 120px;
            background: #9b59b6;
            margin: 20px auto;
            border-radius: 8px;
            animation: fadeIn 1s ease-out, bounce 2s ease-in-out 1s infinite;
            text-align: center;
            line-height: 120px;
            color: white;
        }

        .stats {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: #0f0;
            padding: 10px;
            font-family: monospace;
            font-size: 14px;
            border-radius: 5px;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="stats" id="stats">
        FPS: --<br>
        Frame Time: -- ms
    </div>

    <div class="container">
        <h1 style="color: #2c3e50;">CSS 动画测试 - 浏览器版本</h1>
        
        <h2 style="color: #34495e;">基础动画</h2>
        <div>
            <div class="demo-box fade-in">Fade In</div>
            <div class="demo-box slide-in">Slide In</div>
            <div class="demo-box bounce">Bounce</div>
            <div class="demo-box spin">Spin</div>
            <div class="demo-box pulse">Pulse</div>
            <div class="demo-box color-change">Color</div>
        </div>

        <div class="controls">
            <h3>动画控制</h3>
            <div class="controllable-box" id="controllableBox"></div>
            <button class="btn btn-primary" id="toggleBtn">暂停</button>
            <button class="btn btn-danger" id="restartBtn">重新开始</button>
        </div>

        <div class="controls">
            <h3>Fill-mode 演示</h3>
            <div class="fill-box fill-forwards">forwards</div>
            <div class="fill-box fill-backwards">backwards</div>
            <div class="fill-box fill-both">both</div>
            <br>
            <button class="btn btn-primary" id="fillRestartBtn">重新播放</button>
        </div>

        <div class="controls">
            <h3>多动画组合</h3>
            <div class="multi-box">Multi</div>
        </div>
    </div>

    <script>
        // FPS 计数器
        let frameCount = 0;
        let lastTime = performance.now();
        
        function updateStats() {
            frameCount++;
            const now = performance.now();
            const delta = now - lastTime;
            
            if (delta >= 1000) {
                const fps = Math.round(frameCount * 1000 / delta);
                const frameTime = (delta / frameCount).toFixed(2);
                frameCount = 0;
                lastTime = now;
                
                document.getElementById('stats').innerHTML = 
                    `FPS: ${fps}<br>Frame Time: ${frameTime} ms`;
            }
            
            requestAnimationFrame(updateStats);
        }
        
        requestAnimationFrame(updateStats);

        // 动画控制
        let isPlaying = true;
        const controllableBox = document.getElementById('controllableBox');
        const toggleBtn = document.getElementById('toggleBtn');
        const restartBtn = document.getElementById('restartBtn');

        toggleBtn.addEventListener('click', function() {
            isPlaying = !isPlaying;
            if (isPlaying) {
                controllableBox.classList.remove('paused');
                toggleBtn.textContent = '暂停';
            } else {
                controllableBox.classList.add('paused');
                toggleBtn.textContent = '播放';
            }
        });

        restartBtn.addEventListener('click', function() {
            controllableBox.style.animation = 'none';
            controllableBox.offsetHeight; // 触发 reflow
            controllableBox.style.animation = '';
            controllableBox.classList.remove('paused');
            isPlaying = true;
            toggleBtn.textContent = '暂停';
        });

        // Fill-mode 重新播放
        document.getElementById('fillRestartBtn').addEventListener('click', function() {
            const boxes = document.querySelectorAll('.fill-box');
            boxes.forEach(function(box) {
                box.style.animation = 'none';
                box.offsetHeight;
                box.style.animation = '';
            });
        });

        console.log('=== CSS 动画测试 - 浏览器版本 ===');
        console.log('与 esm_loader test_css_animation.js 使用相同的动画');
        console.log('打开 DevTools -> Performance 标签页分析性能');
    </script>
</body>
</html>
