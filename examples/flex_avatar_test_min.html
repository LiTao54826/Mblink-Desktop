<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Avatar 对齐测试</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 40px;
            background: #f5f5f5;
        }

        /* 测试1: 单层span + 文本 */
        .avatar-simple {
            position: relative;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #d13438;
            color: white;
            font-size: 12px;
            font-weight: 600;
            overflow: hidden;
            flex-shrink: 0;
            user-select: none;
        }
        .debug-grid {
            padding: 10px;
            display: inline-block;
            background-color: #ffffcc;
            background-image:
                linear-gradient(red 1px, transparent 1px),
                linear-gradient(90deg, blue 1px, transparent 1px);
            background-size: 8px 8px;
        }
    </style>
</head>
<body>
    <!-- 测试1: 单层span + 直接文本 -->
    <div class="debug-grid">
        <span class="avatar-simple">JD</span>
        <span class="avatar-simple">CD</span>
    </div>
    
</body>
</html>
