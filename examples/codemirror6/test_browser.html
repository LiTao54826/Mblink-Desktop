<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeMirror 6 Selection Test</title>
    <style>
        body {
            margin: 20px;
            font-family: Arial, sans-serif;
        }
        #container {
            width: 600px;
            height: 400px;
            background: #f0f0f0;
            border: 1px solid #ccc;
        }
        #output {
            margin-top: 20px;
            padding: 10px;
            background: #fff;
            border: 1px solid #ccc;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <h1>CodeMirror 6 Selection Test</h1>
    <div id="container"></div>
    <div id="output"></div>

    <script type="module">
        import { EditorView, basicSetup } from './codemirror6.bundle.js';

        const output = document.getElementById('output');
        function log(msg) {
            output.textContent += msg + '\n';
            console.log(msg);
        }

        log('=== Selection Highlight Test ===');

        const container = document.getElementById('container');

        const view = new EditorView({
            doc: `Hello World
Line 2 here
Line 3 text`,
            extensions: [basicSetup],
            parent: container
        });

        view.focus();

        // 测试全选
        setTimeout(() => {
            log('\n=== Before selection ===');
            log('visibleRanges: ' + view.visibleRanges.map(r => `${r.from}-${r.to}`).join(', '));
            log('viewport: from=' + view.viewport.from + ', to=' + view.viewport.to);

            // 测试 coordsAtPos
            log('\n=== coordsAtPos tests ===');
            const fromCoords = view.coordsAtPos(24, 2);
            const toCoords = view.coordsAtPos(35, -2);
            log('fromCoords (pos=24, side=2): left=' + fromCoords.left.toFixed(2) + ', right=' + fromCoords.right.toFixed(2));
            log('toCoords (pos=35, side=-2): left=' + toCoords.left.toFixed(2) + ', right=' + toCoords.right.toFixed(2));
            log('Expected width: ' + (toCoords.right - fromCoords.left).toFixed(2));

            // 测试 Range.getClientRects
            log('\n=== Range.getClientRects test ===');
            const lines = container.querySelectorAll('.cm-line');
            if (lines.length >= 3) {
                const line3 = lines[2];
                const textNode = line3.firstChild;
                if (textNode && textNode.nodeType === 3) {
                    const range = document.createRange();
                    range.setStart(textNode, 0);
                    range.setEnd(textNode, textNode.textContent.length);
                    const rects = range.getClientRects();
                    log('Range(0, ' + textNode.textContent.length + '): rects=' + rects.length);
                    for (let i = 0; i < rects.length; i++) {
                        const r = rects[i];
                        log('  [' + i + '] left=' + r.left.toFixed(2) + ', right=' + r.right.toFixed(2) + ', width=' + r.width.toFixed(2));
                    }
                }
            }

            // 设置全选
            view.dispatch({
                selection: { anchor: 0, head: 35 }
            });

            log('\n=== After selection ===');
            log('visibleRanges: ' + view.visibleRanges.map(r => `${r.from}-${r.to}`).join(', '));

            setTimeout(() => {
                const selectionLayer = container.querySelector('.cm-selectionLayer');
                if (selectionLayer) {
                    const backgrounds = selectionLayer.querySelectorAll('.cm-selectionBackground');
                    log('\nSelection backgrounds: ' + backgrounds.length);
                    backgrounds.forEach((bg, i) => {
                        log('  [' + i + '] left=' + bg.style.left + ', width=' + bg.style.width);
                    });
                }

                // 检查 browser 对象
                log('\n=== Browser detection ===');
                log('navigator.userAgent: ' + navigator.userAgent);
            }, 200);
        }, 500);
    </script>
</body>
</html>
