<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple coordsAtPos Test</title>
    <style>
        body { margin: 20px; font-family: monospace; }
        #output { white-space: pre; background: #f0f0f0; padding: 10px; }
    </style>
</head>
<body>
    <h1>Simple coordsAtPos Test</h1>
    <div id="container"></div>
    <div id="output"></div>

    <script type="module">
        import { EditorView, basicSetup } from './codemirror6.bundle.js';

        const output = document.getElementById('output');
        function log(msg) {
            output.textContent += msg + '\n';
        }

        const view = new EditorView({
            doc: `Line 3 text`,
            extensions: [basicSetup],
            parent: document.getElementById('container')
        });

        setTimeout(() => {
            log('Document: "' + view.state.doc.toString() + '"');
            log('Length: ' + view.state.doc.length);
            log('');

            // 测试每个位置的 coordsAtPos
            log('=== coordsAtPos with side=2 ===');
            for (let pos = 0; pos <= 11; pos++) {
                const coords = view.coordsAtPos(pos, 2);
                if (coords) {
                    log(`pos ${pos}: left=${coords.left.toFixed(2)}, right=${coords.right.toFixed(2)}, width=${(coords.right - coords.left).toFixed(2)}`);
                }
            }

            log('');
            log('=== coordsAtPos with side=-2 ===');
            for (let pos = 0; pos <= 11; pos++) {
                const coords = view.coordsAtPos(pos, -2);
                if (coords) {
                    log(`pos ${pos}: left=${coords.left.toFixed(2)}, right=${coords.right.toFixed(2)}, width=${(coords.right - coords.left).toFixed(2)}`);
                }
            }

            log('');
            log('=== Range.getClientRects ===');
            const lines = document.querySelectorAll('.cm-line');
            if (lines.length > 0) {
                const textNode = lines[0].firstChild;
                if (textNode && textNode.nodeType === 3) {
                    log('Text node: "' + textNode.textContent + '"');
                    
                    // 测试不同范围
                    const testRanges = [
                        [0, 1],
                        [0, 11],
                        [10, 11],
                        [11, 11]
                    ];
                    
                    for (const [start, end] of testRanges) {
                        const range = document.createRange();
                        range.setStart(textNode, start);
                        range.setEnd(textNode, end);
                        const rects = range.getClientRects();
                        log(`Range(${start}, ${end}): ${rects.length} rects`);
                        for (let i = 0; i < rects.length; i++) {
                            const r = rects[i];
                            log(`  [${i}] left=${r.left.toFixed(2)}, right=${r.right.toFixed(2)}, width=${r.width.toFixed(2)}`);
                        }
                    }
                }
            }

            log('');
            log('=== Browser Info ===');
            log('userAgent: ' + navigator.userAgent);
            log('Chrome: ' + /Chrome\/(\d+)/.test(navigator.userAgent));
            log('Gecko: ' + /gecko\/(\d+)/i.test(navigator.userAgent));
        }, 500);
    </script>
</body>
</html>
