<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LightUI Component Demo</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      line-height: 1.5;
    }
    
    /* Spinner animation */
    @keyframes lightui-spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <script src="../../js/preact/preact.mjs" type="module"></script>
  <script src="../../js/preact/hooks.mjs" type="module"></script>
  <script type="module">
    // 全局暴露 preact
    import * as preact from '../../js/preact/preact.mjs';
    import * as preactHooks from '../../js/preact/hooks.mjs';
    window.preact = preact;
    window.preactHooks = preactHooks;
  </script>
  <script src="demo.js" type="module"></script>
</body>
</html>
