<!DOCTYPE html>
<html>

<head>
    <title>Fetch API Demo</title>
</head>

<body>
    <script>
        /**
         * 增量更新优化 Demo
         *
         * 通过原生 DOM 操作展示 6 项修复的实际效果：
         * 1. HTMLInputElement::SetValue() 脏标记修复
         * 2. Node::RemoveAllChildren() DirtyNodeTracker 记录
         * 3. Element::SetStyle() DirtyNodeTracker 延迟路径
         * 4. Element::SetAttribute()/RemoveAttribute() DirtyNodeTracker 延迟路径
         * 5. classList 精确匹配修复
         * 6. 综合：同帧批量操作合并优化
         *
         * 使用 esm_loader 运行：
         *   build/bin/Release/esm_loader.exe examples/incremental_update_demo/app.js
         */

        // ========== 工具函数 ==========

        function createEl(tag, styles, text) {
            const el = document.createElement(tag);
            if (styles) {
                for (const [k, v] of Object.entries(styles)) {
                    el.style[k] = v;
                }
            }
            if (text) el.textContent = text;
            return el;
        }

        function log(container, msg, type) {
            const line = createEl('div', {
                fontFamily: 'monospace',
                fontSize: '12px',
                padding: '2px 0',
                color: type === 'ok' ? '#4ade80' : type === 'err' ? '#f87171' : type === 'info' ? '#60a5fa' : '#cbd5e1'
            }, msg);
            container.appendChild(line);
        }

        // ========== 注入全局样式 ==========

        const style = document.createElement('style');
        style.textContent = `
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        padding: 24px;
    }
`;
        document.head.appendChild(style);

        // ========== 页面标题 ==========

        const header = createEl('div', { textAlign: 'center', marginBottom: '24px' });
        header.appendChild(createEl('div', { fontSize: '24px', color: '#38bdf8', fontWeight: 'bold', marginBottom: '6px' }, '增量更新优化 Demo'));
        header.appendChild(createEl('div', { fontSize: '13px', color: '#94a3b8' }, '原生 DOM 操作 — 展示 6 项修复效果'));
        document.body.appendChild(header);


        // ========== 卡片容器 ==========

        const grid = createEl('div', { display: 'flex', flexWrap: 'wrap', gap: '16px', justifyContent: 'center' });
        document.body.appendChild(grid);

        function createCard(title, tagText, tagColor, desc) {
            const card = createEl('div', {
                background: '#1e293b',
                border: '1px solid #334155',
                borderRadius: '12px',
                padding: '16px',
                width: '380px'
            });
            card.appendChild(createEl('div', { fontSize: '15px', color: '#38bdf8', fontWeight: 'bold', marginBottom: '4px' }, title));
            const tag = createEl('span', {
                display: 'inline-block',
                fontSize: '11px',
                padding: '1px 8px',
                borderRadius: '4px',
                background: tagColor + '20',
                color: tagColor,
                border: '1px solid ' + tagColor + '40',
                marginBottom: '8px'
            }, tagText);
            card.appendChild(tag);
            card.appendChild(createEl('div', { fontSize: '12px', color: '#94a3b8', marginBottom: '10px', lineHeight: '1.5' }, desc));
            const logBox = createEl('div', {
                background: '#0f172a',
                borderRadius: '6px',
                padding: '8px',
                minHeight: '60px',
                maxHeight: '150px',
                overflow: 'auto'
            });
            card.appendChild(logBox);
            grid.appendChild(card);
            return { card, logBox };
        }

        function createBtn(parent, text, color, onClick) {
            const btn = createEl('button', {
                padding: '6px 14px',
                border: 'none',
                borderRadius: '5px',
                fontSize: '12px',
                fontWeight: '600',
                cursor: 'pointer',
                marginRight: '6px',
                marginBottom: '6px',
                background: color,
                color: 'white'
            }, text);
            btn.addEventListener('click', onClick);
            parent.appendChild(btn);
            return btn;
        }


        // ========== Demo 1: input.value 脏标记修复 ==========
        {
            const { card, logBox } = createCard(
                '1. input.value 脏标记',
                'Bug 修复',
                '#f87171',
                '修复前：JS 设置 input.value 不触发重绘。修复后：值变化自动标脏并通知 Window 重绘。'
            );

            const input = document.createElement('input');
            input.type = 'text';
            input.value = '初始值';
            input.style.cssText = 'padding:6px 10px;background:#0f172a;border:1px solid #475569;border-radius:5px;color:#e2e8f0;font-size:13px;width:100%;margin-bottom:8px';
            card.insertBefore(input, logBox);

            const btnRow = createEl('div', { marginBottom: '8px' });
            card.insertBefore(btnRow, logBox);

            let counter = 0;
            createBtn(btnRow, '程序化设值', '#2563eb', () => {
                counter++;
                const newVal = '更新 #' + counter + ' (时间: ' + Date.now() % 10000 + ')';
                input.value = newVal;
                log(logBox, '✓ input.value = "' + newVal + '"', 'ok');
                log(logBox, '  → MarkDirty(PAINT) + SetNeedsRepaint() 已触发', 'info');
            });

            createBtn(btnRow, '设相同值', '#475569', () => {
                const cur = input.value;
                input.value = cur;
                log(logBox, '⊘ 设置相同值 "' + cur + '" → 跳过脏标记', 'info');
            });

            log(logBox, '点击按钮测试 input.value 编程式赋值', 'info');
        }

        // ========== Demo 2: RemoveAllChildren DirtyNodeTracker ==========
        {
            const { card, logBox } = createCard(
                '2. RemoveAllChildren 追踪',
                '延迟路径补齐',
                '#60a5fa',
                '修复前：SetTextContent/SetInnerHTML 清空子节点不记录到 DirtyNodeTracker。修复后：每个移除的子节点都被追踪。'
            );

            const container = createEl('div', {
                background: '#0f172a',
                borderRadius: '6px',
                padding: '8px',
                marginBottom: '8px',
                minHeight: '40px'
            });
            card.insertBefore(container, logBox);

            function populateChildren(n) {
                for (let i = 0; i < n; i++) {
                    const child = createEl('span', {
                        display: 'inline-block',
                        padding: '2px 8px',
                        margin: '2px',
                        borderRadius: '4px',
                        fontSize: '11px',
                        background: '#334155',
                        color: '#cbd5e1'
                    }, '子节点' + (i + 1));
                    container.appendChild(child);
                }
            }
            populateChildren(5);

            const btnRow = createEl('div', { marginBottom: '8px' });
            card.insertBefore(btnRow, logBox);

            createBtn(btnRow, 'SetTextContent', '#2563eb', () => {
                const count = container.childNodes.length;
                container.textContent = '已替换为文本';
                log(logBox, '✓ textContent 替换 ' + count + ' 个子节点', 'ok');
                log(logBox, '  → DirtyTracker: ' + count + ' 条 Removed + 1 条 Added', 'info');
            });

            createBtn(btnRow, '重新填充', '#16a34a', () => {
                container.textContent = '';
                populateChildren(5);
                log(logBox, '✓ 重新添加 5 个子节点', 'ok');
            });

            log(logBox, '观察 RemoveAllChildren 的 DirtyNodeTracker 记录', 'info');
        }


        // ========== Demo 3: SetStyle 延迟路径 ==========
        {
            const { card, logBox } = createCard(
                '3. SetStyle 延迟路径',
                '合并优化',
                '#60a5fa',
                '修复前：每次 el.style.x = y 立即触发 ResolveStyle。修复后：同帧多次修改记录到 DirtyNodeTracker，Optimize() 合并后统一处理。'
            );

            const box = createEl('div', {
                padding: '16px',
                background: '#334155',
                borderRadius: '8px',
                textAlign: 'center',
                fontSize: '14px',
                marginBottom: '8px',
                transition: 'none'
            }, '样式目标');
            card.insertBefore(box, logBox);

            const btnRow = createEl('div', { marginBottom: '8px' });
            card.insertBefore(btnRow, logBox);

            createBtn(btnRow, '批量改 5 个属性', '#2563eb', () => {
                const colors = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6'];
                const color = colors[Math.floor(Math.random() * colors.length)];
                // 同帧内连续修改 5 个不同属性
                box.style.background = color;
                box.style.color = 'white';
                box.style.fontSize = (12 + Math.floor(Math.random() * 8)) + 'px';
                box.style.padding = (8 + Math.floor(Math.random() * 16)) + 'px';
                box.style.borderRadius = (4 + Math.floor(Math.random() * 12)) + 'px';
                log(logBox, '✓ 同帧修改 5 个属性 (bg/color/font/pad/radius)', 'ok');
                log(logBox, '  → DirtyTracker: 5 条 StyleChange，Optimize 保留 5 条', 'info');
            });

            createBtn(btnRow, '同属性改 3 次', '#d97706', () => {
                // 同帧内对同一属性修改 3 次，应合并为 1 条
                box.style.background = '#ef4444';
                box.style.background = '#3b82f6';
                box.style.background = '#10b981';
                log(logBox, '✓ background 连改 3 次: red→blue→green', 'ok');
                log(logBox, '  → DirtyTracker: 3 条记录，Optimize 合并为 1 条', 'info');
            });

            log(logBox, '测试同帧样式变化的合并优化', 'info');
        }

        // ========== Demo 4: SetAttribute/RemoveAttribute 延迟路径 ==========
        {
            const { card, logBox } = createCard(
                '4. Attribute 延迟路径',
                '延迟路径补齐',
                '#60a5fa',
                '修复前：属性变化只走即时路径。修复后：SetAttribute/RemoveAttribute 也记录到 DirtyNodeTracker，支持同帧合并。'
            );

            const target = createEl('div', {
                padding: '12px',
                background: '#334155',
                borderRadius: '8px',
                textAlign: 'center',
                fontSize: '13px',
                marginBottom: '8px'
            }, 'data-status: (无)');
            card.insertBefore(target, logBox);

            const btnRow = createEl('div', { marginBottom: '8px' });
            card.insertBefore(btnRow, logBox);

            let attrCounter = 0;
            createBtn(btnRow, 'SetAttribute', '#2563eb', () => {
                attrCounter++;
                const val = 'state-' + attrCounter;
                target.setAttribute('data-status', val);
                target.textContent = 'data-status: ' + val;
                log(logBox, '✓ setAttribute("data-status", "' + val + '")', 'ok');
                log(logBox, '  → DirtyTracker: RecordStyleChanged 已记录', 'info');
            });

            createBtn(btnRow, 'RemoveAttribute', '#dc2626', () => {
                target.removeAttribute('data-status');
                target.textContent = 'data-status: (已移除)';
                log(logBox, '✓ removeAttribute("data-status")', 'ok');
                log(logBox, '  → DirtyTracker: new_value="" 已记录', 'info');
            });

            createBtn(btnRow, '同帧改 3 次', '#d97706', () => {
                target.setAttribute('data-status', 'a');
                target.setAttribute('data-status', 'b');
                target.setAttribute('data-status', 'c');
                target.textContent = 'data-status: c (经 3 次修改)';
                log(logBox, '✓ 同帧 setAttribute 3 次: a→b→c', 'ok');
                log(logBox, '  → Optimize 合并为 1 条: old→c', 'info');
            });

            log(logBox, '测试属性变化的 DirtyNodeTracker 记录', 'info');
        }


        // ========== Demo 5: classList 精确匹配 ==========
        {
            const { card, logBox } = createCard(
                '5. classList 精确匹配',
                '子串误匹配修复',
                '#4ade80',
                '修复前：classList.contains("btn") 在 "btn-primary" 上返回 true。修复后：按空格分词精确匹配。'
            );

            const target = createEl('div', {
                padding: '12px',
                background: '#334155',
                borderRadius: '8px',
                fontSize: '13px',
                marginBottom: '8px'
            });
            target.className = 'btn-primary btn-lg';
            target.textContent = 'className: "btn-primary btn-lg"';
            card.insertBefore(target, logBox);

            const btnRow = createEl('div', { marginBottom: '8px' });
            card.insertBefore(btnRow, logBox);

            createBtn(btnRow, 'contains("btn")', '#2563eb', () => {
                const result = target.classList.contains('btn');
                log(logBox, 'classList.contains("btn") = ' + result, result ? 'err' : 'ok');
                if (!result) {
                    log(logBox, '  ✓ 正确！"btn" 不是 "btn-primary" 或 "btn-lg"', 'ok');
                } else {
                    log(logBox, '  ✗ 错误！子串误匹配仍存在', 'err');
                }
            });

            createBtn(btnRow, 'contains("btn-primary")', '#16a34a', () => {
                const result = target.classList.contains('btn-primary');
                log(logBox, 'classList.contains("btn-primary") = ' + result, result ? 'ok' : 'err');
            });

            createBtn(btnRow, 'add("btn")', '#d97706', () => {
                target.classList.add('btn');
                target.textContent = 'className: "' + target.className + '"';
                log(logBox, '✓ classList.add("btn") → "' + target.className + '"', 'ok');
            });

            createBtn(btnRow, 'remove("btn")', '#dc2626', () => {
                target.classList.remove('btn');
                target.textContent = 'className: "' + target.className + '"';
                log(logBox, '✓ classList.remove("btn") → "' + target.className + '"', 'ok');
            });

            createBtn(btnRow, 'toggle("active")', '#8b5cf6', () => {
                const result = target.classList.toggle('active');
                target.textContent = 'className: "' + target.className + '"';
                log(logBox, '✓ classList.toggle("active") = ' + result + ' → "' + target.className + '"', 'ok');
            });

            createBtn(btnRow, '重置', '#475569', () => {
                target.className = 'btn-primary btn-lg';
                target.textContent = 'className: "btn-primary btn-lg"';
                log(logBox, '↺ 重置为 "btn-primary btn-lg"', 'info');
            });

            log(logBox, '测试 classList 的精确匹配行为', 'info');
        }

        // ========== Demo 6: 综合批量操作 ==========
        {
            const { card, logBox } = createCard(
                '6. 综合：批量操作合并',
                '端到端验证',
                '#fbbf24',
                '模拟真实场景：同帧内执行结构变化 + 样式变化 + 属性变化，验证 DirtyNodeTracker 的 Optimize 合并效果。'
            );

            const container = createEl('div', {
                background: '#0f172a',
                borderRadius: '6px',
                padding: '8px',
                marginBottom: '8px',
                minHeight: '40px'
            });
            card.insertBefore(container, logBox);

            const btnRow = createEl('div', { marginBottom: '8px' });
            card.insertBefore(btnRow, logBox);

            createBtn(btnRow, '模拟列表更新', '#2563eb', () => {
                const start = Date.now();

                // 清空旧内容（RemoveAllChildren → N 条 Removed）
                const oldCount = container.childNodes.length;
                container.textContent = '';

                // 添加新项目（AppendChild → M 条 Added）
                const items = ['任务A', '任务B', '任务C', '任务D', '任务E'];
                const colors = ['#ef4444', '#f59e0b', '#10b981', '#3b82f6', '#8b5cf6'];
                items.forEach((text, i) => {
                    const item = createEl('div', {
                        display: 'flex',
                        alignItems: 'center',
                        padding: '6px 10px',
                        marginBottom: '4px',
                        borderRadius: '6px',
                        fontSize: '13px'
                    });
                    // 同帧内对每个新元素设置多个样式
                    item.style.background = colors[i];
                    item.style.color = 'white';
                    item.style.fontWeight = '600';
                    // 设置属性
                    item.setAttribute('data-index', String(i));
                    item.setAttribute('data-status', 'active');
                    item.textContent = text + ' (index=' + i + ')';
                    container.appendChild(item);
                });

                const elapsed = Date.now() - start;
                log(logBox, '✓ 列表更新完成 (' + elapsed + 'ms)', 'ok');
                log(logBox, '  清空: ' + oldCount + ' 条 Removed', 'info');
                log(logBox, '  新增: ' + items.length + ' 条 Added + ' + (items.length * 3) + ' 条 StyleChange + ' + (items.length * 2) + ' 条 AttrChange', 'info');
                log(logBox, '  → Optimize 合并后统一同步到渲染树', 'info');
            });

            createBtn(btnRow, 'Add+Remove 取消', '#d97706', () => {
                // 先添加再立即移除 → Optimize 应取消这对操作
                const temp = createEl('div', { padding: '6px', background: '#475569', borderRadius: '4px', fontSize: '12px' }, '临时节点');
                container.appendChild(temp);
                container.removeChild(temp);
                log(logBox, '✓ AppendChild + RemoveChild 同帧执行', 'ok');
                log(logBox, '  → Optimize: Added + Removed = 取消（零开销）', 'info');
            });

            createBtn(btnRow, '清空', '#475569', () => {
                container.textContent = '';
                log(logBox, '↺ 容器已清空', 'info');
            });

            log(logBox, '模拟真实场景的批量 DOM 操作', 'info');
        }


        function px(v) {
            if (typeof v === 'number') return v.toFixed(2);
            return String(v);
        }

        function dumpNodeLayout(node, depth, indexPath) {
            if (!node || node.nodeType !== 1) return;
            const rect = node.getBoundingClientRect();
            const cs = window.getComputedStyle(node);
            const tag = (node.tagName || '').toLowerCase();
            const id = node.id ? ('#' + node.id) : '';
            const cls = node.className ? ('.' + String(node.className).trim().replace(/\s+/g, '.')) : '';
            const text = (node.textContent || '').trim().slice(0, 40);

            console.log('[layout] ' + JSON.stringify({
                path: indexPath,
                depth,
                node: tag + id + cls,
                text,
                rect: {
                    x: px(rect.x), y: px(rect.y), w: px(rect.width), h: px(rect.height),
                    top: px(rect.top), right: px(rect.right), bottom: px(rect.bottom), left: px(rect.left)
                },
                box: {
                    display: cs.display,
                    position: cs.position,
                    width: cs.width,
                    height: cs.height,
                    margin: [cs.marginTop, cs.marginRight, cs.marginBottom, cs.marginLeft].join(' '),
                    padding: [cs.paddingTop, cs.paddingRight, cs.paddingBottom, cs.paddingLeft].join(' '),
                    border: [cs.borderTopWidth, cs.borderRightWidth, cs.borderBottomWidth, cs.borderLeftWidth].join(' '),
                    overflow: cs.overflow,
                    overflowX: cs.overflowX,
                    overflowY: cs.overflowY,
                    fontSize: cs.fontSize,
                    lineHeight: cs.lineHeight
                },
                childCount: node.children ? node.children.length : 0
            }));

            if (!node.children) return;
            for (let i = 0; i < node.children.length; i++) {
                dumpNodeLayout(node.children[i], depth + 1, indexPath + '.' + i);
            }
        }

        function dumpCardLayoutReport() {
            const cards = document.body.querySelectorAll('div > div');
            const gridNode = grid;
            const bodyRect = document.body.getBoundingClientRect();
            const gridRect = gridNode.getBoundingClientRect();

            console.log('[layout-report] ===== 页面布局采样开始 =====');
            console.log('[layout-report] body', {
                rect: { x: px(bodyRect.x), y: px(bodyRect.y), w: px(bodyRect.width), h: px(bodyRect.height) },
                cssPadding: window.getComputedStyle(document.body).padding
            });
            console.log('[layout-report] grid', {
                rect: { x: px(gridRect.x), y: px(gridRect.y), w: px(gridRect.width), h: px(gridRect.height) },
                css: {
                    display: window.getComputedStyle(gridNode).display,
                    flexWrap: window.getComputedStyle(gridNode).flexWrap,
                    justifyContent: window.getComputedStyle(gridNode).justifyContent,
                    gap: window.getComputedStyle(gridNode).gap
                }
            });

            let cardIdx = 0;
            for (let i = 0; i < gridNode.children.length; i++) {
                const card = gridNode.children[i];
                cardIdx++;
                console.log('[layout-report] ---- card #' + cardIdx + ' ----');
                dumpNodeLayout(card, 0, 'card' + cardIdx);
            }
            console.log('[layout-report] ===== 页面布局采样结束 =====');
        }

        setTimeout(() => {
            dumpCardLayoutReport();
        }, 120);

        console.log('[incremental_update_demo] Demo loaded');
        console.log('[incremental_update_demo] 将在 120ms 后输出卡片内元素布局结构、大小与位置');
        console.log('[incremental_update_demo] 对比重点: card width=380px, card padding=16px, btn margin-right=6px, logBox minH=60/maxH=150/overflow=auto');

    </script>
</body>

</html>
