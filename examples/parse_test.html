<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>解析测试</title>
    <style>
        /* 测试1: 最简单的双渐变 */
        .test1 {
            width: 200px;
            height: 200px;
            border: 2px solid black;
            margin: 20px;
            background-color: white;
            background-image: linear-gradient(red, blue), linear-gradient(90deg, green, yellow);
        }
        
        /* 测试2: 带 background-size 的双渐变（size 在前） */
        .test2 {
            width: 200px;
            height: 200px;
            border: 2px solid black;
            margin: 20px;
            background-color: white;
            background-size: 20px 20px;
            background-image: linear-gradient(red 10px, transparent 10px), linear-gradient(90deg, blue 10px, transparent 10px);
        }
        
        /* 测试3: 原始的网格 */
        .test3 {
            width: 200px;
            height: 200px;
            border: 2px solid black;
            margin: 20px;
            background-color: white;
            background-image: linear-gradient(rgba(0,0,0,0.5) 1px, transparent 1px), linear-gradient(90deg, rgba(0,0,0,0.5) 1px, transparent 1px);
            background-size: 8px 8px;
        }
    </style>
</head>
<body>
    <h1>解析测试</h1>
    <div class="test1">Test 1: 双渐变（无size）</div>
    <div class="test2">Test 2: 双渐变（有size，10px线条）</div>
    <div class="test3">Test 3: 网格（rgba，1px线条）</div>
</body>
</html>
