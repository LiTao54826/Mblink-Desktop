<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Layout Data Collector</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
        #data-output { 
            position: fixed; top: 0; right: 0; width: 500px; height: 100vh;
            background: #1e1e1e; color: #ddd; font-family: monospace; font-size: 11px;
            overflow: auto; padding: 10px; z-index: 10000;
        }
        #data-output pre { margin: 0; white-space: pre-wrap; word-break: break-all; }
        #content-area { margin-right: 510px; width: 450px; }
        .copy-btn { position: fixed; top: 10px; right: 520px; padding: 10px 20px; background: #4CAF50; color: white; border: none; cursor: pointer; z-index: 10001; }
    </style>
</head>
<body>
    <button class="copy-btn" onclick="copyData()">复制数据</button>
    <div id="data-output"><pre id="json-output">Loading...</pre></div>
    <div id="content-area"></div>

    <script src="https://unpkg.com/preact@10.19.3/dist/preact.umd.js"></script>
    <script src="https://unpkg.com/preact@10.19.3/hooks/dist/hooks.umd.js"></script>
    
    <script>
        if (typeof window !== 'undefined' && window.preact) {
            var Preact = {
                h: window.preact.h, createElement: window.preact.createElement,
                render: window.preact.render, Fragment: window.preact.Fragment, Component: window.preact.Component
            };
            var PreactHooks = {
                useState: window.preactHooks.useState, useEffect: window.preactHooks.useEffect,
                useLayoutEffect: window.preactHooks.useLayoutEffect, useRef: window.preactHooks.useRef,
                useMemo: window.preactHooks.useMemo, useCallback: window.preactHooks.useCallback,
                useContext: window.preactHooks.useContext, useReducer: window.preactHooks.useReducer
            };
        }
    </script>
    <script src="app.js"></script>
    
    <script>
        var collectedData = {};
        
        function getTestId(element) {
            // 从h3标题获取测试ID
            var h3 = element.querySelector('h3');
            if (h3) {
                var text = h3.textContent.trim();
                var match = text.match(/^([A-Z]+-\d+|[\d.]+)/);
                if (match) return match[1];
            }
            return null;
        }
        
        function getElementData(el) {
            var rect = el.getBoundingClientRect();
            var style = window.getComputedStyle(el);
            return {
                tag: el.tagName.toLowerCase(),
                x: Math.round(rect.left * 10) / 10,
                y: Math.round(rect.top * 10) / 10,
                width: Math.round(rect.width * 10) / 10,
                height: Math.round(rect.height * 10) / 10,
                // Box model
                marginTop: parseFloat(style.marginTop) || 0,
                marginRight: parseFloat(style.marginRight) || 0,
                marginBottom: parseFloat(style.marginBottom) || 0,
                marginLeft: parseFloat(style.marginLeft) || 0,
                paddingTop: parseFloat(style.paddingTop) || 0,
                paddingRight: parseFloat(style.paddingRight) || 0,
                paddingBottom: parseFloat(style.paddingBottom) || 0,
                paddingLeft: parseFloat(style.paddingLeft) || 0,
                borderTopWidth: parseFloat(style.borderTopWidth) || 0,
                borderRightWidth: parseFloat(style.borderRightWidth) || 0,
                borderBottomWidth: parseFloat(style.borderBottomWidth) || 0,
                borderLeftWidth: parseFloat(style.borderLeftWidth) || 0,
                // Display
                display: style.display,
                position: style.position,
                boxSizing: style.boxSizing,
                overflow: style.overflow,
                // Flex
                flexGrow: style.flexGrow,
                flexShrink: style.flexShrink,
                flexBasis: style.flexBasis,
                // Text
                textAlign: style.textAlign,
                lineHeight: style.lineHeight,
                whiteSpace: style.whiteSpace,
                textOverflow: style.textOverflow,
                // Text content (for text nodes)
                textContent: el.childNodes.length === 1 && el.childNodes[0].nodeType === 3 
                    ? el.childNodes[0].textContent.substring(0, 50) : null
            };
        }
        
        function collectTestData(container) {
            var data = { container: getElementData(container), children: [] };
            
            // 获取测试区域（跳过h3标题）
            var testArea = container.querySelector('div > div') || container.querySelector('div');
            if (testArea && testArea !== container) {
                data.testArea = getElementData(testArea);
                
                // 获取所有直接子元素
                Array.from(testArea.children).forEach(function(child, idx) {
                    var childData = getElementData(child);
                    childData.index = idx;
                    
                    // 递归获取嵌套子元素（最多2层）
                    if (child.children.length > 0 && child.children.length < 10) {
                        childData.children = [];
                        Array.from(child.children).forEach(function(grandChild, gIdx) {
                            var gcData = getElementData(grandChild);
                            gcData.index = gIdx;
                            childData.children.push(gcData);
                        });
                    }
                    
                    data.children.push(childData);
                });
            }
            
            return data;
        }
        
        function collectAllData() {
            var result = { timestamp: new Date().toISOString(), tests: {} };
            
            // 查找所有测试容器
            var testContainers = document.querySelectorAll('#content-area > div > section > div');
            
            testContainers.forEach(function(container) {
                var testId = getTestId(container);
                if (testId) {
                    result.tests[testId] = collectTestData(container);
                }
            });
            
            return result;
        }
        
        function copyData() {
            var text = JSON.stringify(collectedData, null, 2);
            navigator.clipboard.writeText(text).then(function() {
                alert('数据已复制到剪贴板！');
            });
        }
        
        // 等待渲染完成后收集数据
        setTimeout(function() {
            collectedData = collectAllData();
            document.getElementById('json-output').textContent = JSON.stringify(collectedData, null, 2);
            console.log('Browser Layout Data:', collectedData);
        }, 1000);
    </script>
</body>
</html>
