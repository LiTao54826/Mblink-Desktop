<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>高级布局对比测试 - MBink vs Browser</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: Arial, sans-serif; }
    </style>
</head>
<body>
    <!-- 加载 Preact CDN -->
    <script src="https://unpkg.com/preact@10.19.3/dist/preact.umd.js"></script>
    <script src="https://unpkg.com/preact@10.19.3/hooks/dist/hooks.umd.js"></script>

    <script>
        // 浏览器兼容层 - 映射到 MBink 全局格式
        if (typeof window !== 'undefined' && window.preact) {
            var Preact = {
                h: window.preact.h,
                createElement: window.preact.createElement,
                render: window.preact.render,
                Fragment: window.preact.Fragment,
                Component: window.preact.Component
            };
            var PreactHooks = {
                useState: window.preactHooks.useState,
                useEffect: window.preactHooks.useEffect,
                useLayoutEffect: window.preactHooks.useLayoutEffect,
                useRef: window.preactHooks.useRef,
                useMemo: window.preactHooks.useMemo,
                useCallback: window.preactHooks.useCallback,
                useContext: window.preactHooks.useContext,
                useReducer: window.preactHooks.useReducer
            };
        }
    </script>

    <!-- 加载高级测试 app.js -->
    <script src="app_advanced.js"></script>
    <script>
        // 强制渲染高级测试
        Preact.render(Preact.h(window.AdvancedLayoutTests.AdvancedApp), document.body);
    </script>

    <script>
        /**
         * 收集高级测试布局数据
         * 在浏览器 DevTools Console 中运行此函数
         */
        function collectAdvancedLayoutData() {
            var data = {
                "_meta": {
                    "description": "Chrome 浏览器高级布局参考数据 - 用于 MBink 高级布局对比验证",
                    "generatedAt": new Date().toISOString(),
                    "browserViewport": {
                        "width": window.innerWidth,
                        "height": window.innerHeight
                    },
                    "tolerances": { "width": 1, "height": 3, "x": 1, "y": 3 }
                }
            };

            // 收集所有带 id 的测试元素
            var allElements = document.querySelectorAll('[id^="ADV-"]');
            allElements.forEach(function(el) {
                var id = el.id;
                var rect = el.getBoundingClientRect();
                var parentRect = el.parentElement ? el.parentElement.getBoundingClientRect() : { left: 0, top: 0 };
                var computedStyle = window.getComputedStyle(el);

                data[id] = {
                    id: id,
                    width: Math.round(rect.width * 100) / 100,
                    height: Math.round(rect.height * 100) / 100,
                    x: Math.round(rect.left * 100) / 100,
                    y: Math.round(rect.top * 100) / 100,
                    relX: Math.round((rect.left - parentRect.left) * 100) / 100,
                    relY: Math.round((rect.top - parentRect.top) * 100) / 100,
                    display: computedStyle.display,
                    position: computedStyle.position
                };
            });

            // 输出 JSON
            var json = JSON.stringify(data, null, 2);
            console.log('=== Advanced Layout Reference Data ===');
            console.log(json);
            console.log('=== Copy above JSON to browser_reference_data_advanced.json ===');

            // 提供下载链接
            var blob = new Blob([json], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'browser_reference_data_advanced.json';
            a.textContent = '📥 Download Advanced Layout Data';
            a.style.cssText = 'position:fixed;top:10px;right:10px;padding:10px 20px;background:#4CAF50;color:white;text-decoration:none;border-radius:4px;z-index:10000;';
            document.body.appendChild(a);

            return data;
        }

        // 自动提示用户
        console.log('🔧 高级布局测试页面已加载');
        console.log('📊 运行 collectAdvancedLayoutData() 收集布局数据');
        console.log('📏 请确保将浏览器窗口设置为 453px 宽度 (DevTools Responsive 模式)');
    </script>
</body>
</html>
