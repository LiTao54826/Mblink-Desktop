<!DOCTYPE html>
<html>
<head>
    <title>Fetch API Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1a1a2e;
            color: #eee;
        }
        h1 {
            color: #00d4ff;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        .result {
            background: #16213e;
            border-radius: 8px;
            padding: 15px;
            margin: 10px 0;
            border-left: 4px solid #00d4ff;
        }
        .loading {
            color: #ffd700;
        }
        .success {
            color: #00ff88;
        }
        .error {
            color: #ff4444;
        }
        pre {
            background: #0f3460;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
        button {
            background: #00d4ff;
            color: #1a1a2e;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            margin: 5px;
        }
        button:hover {
            background: #00b8e6;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌐 Fetch API Demo</h1>
        <p>Testing async HTTP requests with MBink's fetch implementation</p>
        
        <div>
            <button id="btn-get">GET Request</button>
            <button id="btn-post">POST Request</button>
        </div>
        
        <div id="results"></div>
    </div>
    
    <script>
        const resultsDiv = document.getElementById('results');
        
        function addResult(title, content, status) {
            const div = document.createElement('div');
            div.className = 'result';
            div.innerHTML = '<strong>' + title + '</strong>: <span class="' + status + '">' + content + '</span>';
            resultsDiv.appendChild(div);
        }
        
        function addJsonResult(title, data) {
            const div = document.createElement('div');
            div.className = 'result';
            const pre = document.createElement('pre');
            pre.textContent = JSON.stringify(data, null, 2);
            div.innerHTML = '<strong class="success">' + title + '</strong>';
            div.appendChild(pre);
            resultsDiv.appendChild(div);
        }
        
        // GET 请求测试
        document.getElementById('btn-get').addEventListener('click', function() {
            addResult('GET Request', 'Loading...', 'loading');
            
            fetch('https://jsonplaceholder.typicode.com/posts/1')
                .then(function(response) {
                    addResult('Response Status', response.status + ' ' + (response.ok ? 'OK' : 'Failed'), response.ok ? 'success' : 'error');
                    return response.json();
                })
                .then(function(data) {
                    addJsonResult('GET Response Data', data);
                })
                .catch(function(error) {
                    addResult('Error', error.message, 'error');
                });
        });
        
        // POST 请求测试
        document.getElementById('btn-post').addEventListener('click', function() {
            addResult('POST Request', 'Loading...', 'loading');
            
            fetch('https://jsonplaceholder.typicode.com/posts', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    title: 'Test Post',
                    body: 'This is a test post from MBink',
                    userId: 1
                })
            })
            .then(function(response) {
                addResult('Response Status', response.status + ' ' + (response.ok ? 'OK' : 'Failed'), response.ok ? 'success' : 'error');
                return response.json();
            })
            .then(function(data) {
                addJsonResult('POST Response Data', data);
            })
            .catch(function(error) {
                addResult('Error', error.message, 'error');
            });
        });
        
        // 初始消息
        addResult('Status', 'Ready - Click a button to test', 'success');
    </script>
</body>
</html>
