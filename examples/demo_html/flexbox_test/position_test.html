<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Position & Overflow Test</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f0f0f0;
            font-family: "Segoe UI", "Microsoft YaHei", Arial, sans-serif;
        }

        h1 {
            color: #333;
            text-align: center;
        }

        /* Relative positioning test */
        .relative-container {
            background: #667eea;
            border-radius: 8px;
            padding: 20px;
            margin: 10px 0;
            position: relative;
            height: 150px;
        }

        .relative-box {
            background: white;
            border-radius: 4px;
            padding: 10px;
            width: 100px;
            position: relative;
            top: 20px;
            left: 30px;
        }

        /* Absolute positioning test */
        .absolute-container {
            background: #51cf66;
            border-radius: 8px;
            padding: 20px;
            margin: 10px 0;
            position: relative;
            height: 150px;
        }

        .absolute-box {
            background: white;
            border-radius: 4px;
            padding: 10px;
            width: 100px;
            position: absolute;
            top: 10px;
            right: 10px;
        }

        .absolute-box-2 {
            background: #ffd43b;
            border-radius: 4px;
            padding: 10px;
            width: 100px;
            position: absolute;
            bottom: 10px;
            left: 10px;
        }

        /* Overflow test */
        .overflow-container {
            background: #ff6b6b;
            border-radius: 8px;
            padding: 20px;
            margin: 10px 0;
        }

        .overflow-hidden {
            background: white;
            border-radius: 4px;
            padding: 10px;
            width: 200px;
            height: 60px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .overflow-scroll {
            background: white;
            border-radius: 4px;
            padding: 10px;
            width: 200px;
            height: 60px;
            overflow: scroll;
        }

        .overflow-content {
            background: #e9ecef;
            padding: 10px;
            width: 300px;
            height: 100px;
        }

        /* Z-index test */
        .zindex-container {
            background: #f783ac;
            border-radius: 8px;
            padding: 20px;
            margin: 10px 0;
            position: relative;
            height: 150px;
        }

        .zindex-box-1 {
            background: #4dabf7;
            border-radius: 4px;
            padding: 10px;
            width: 100px;
            height: 80px;
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1;
        }

        .zindex-box-2 {
            background: #ffd43b;
            border-radius: 4px;
            padding: 10px;
            width: 100px;
            height: 80px;
            position: absolute;
            top: 40px;
            left: 40px;
            z-index: 2;
        }

        .zindex-box-3 {
            background: #ff6b6b;
            border-radius: 4px;
            padding: 10px;
            width: 100px;
            height: 80px;
            position: absolute;
            top: 60px;
            left: 60px;
            z-index: 3;
        }
    </style>
</head>
<body>
    <h1>CSS Position & Overflow Test</h1>

    <!-- Relative positioning -->
    <div class="relative-container">
        <div class="relative-box">
            Relative (top: 20px, left: 30px)
        </div>
    </div>

    <!-- Absolute positioning -->
    <div class="absolute-container">
        <div class="absolute-box">
            Absolute (top: 10px, right: 10px)
        </div>
        <div class="absolute-box-2">
            Absolute (bottom: 10px, left: 10px)
        </div>
    </div>

    <!-- Overflow hidden -->
    <div class="overflow-container">
        <div class="overflow-hidden">
            <div class="overflow-content">
                Content clipped by overflow: hidden
            </div>
        </div>

        <div class="overflow-scroll">
            <div class="overflow-content">
                Content with overflow: scroll
            </div>
        </div>
    </div>

    <!-- Z-index test -->
    <div class="zindex-container">
        <div class="zindex-box-1">z-index: 1</div>
        <div class="zindex-box-2">z-index: 2</div>
        <div class="zindex-box-3">z-index: 3</div>
    </div>
</body>
</html>
