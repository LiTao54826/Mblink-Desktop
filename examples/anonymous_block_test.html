<!DOCTYPE html>
<html>

<head>
    <title>Anonymous Block Box Test</title>
    <style>
        body {
            margin: 20px;
            font-family: Arial, sans-serif;
        }

        .container {
            border: 2px solid #333;
            padding: 10px;
            margin-bottom: 20px;
        }

        button {
            padding: 8px 16px;
            margin: 0 5px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.3s;
        }

        button:hover {
            background: #0056b3;
        }

        h3 {
            margin-top: 0;
        }
    </style>
</head>

<body>
    <h1>匿名块盒测试</h1>

    <div class="container">
        <h3>混合内容（块级 + 内联级）</h3><button>按钮1</button><button>按钮2</button><button>按钮3</button>
    </div>

    <div class="container">
        <h3>另一个混合容器</h3>
        <button>Test A</button>
        <button>Test B</button>
        <button>Test C</button>
    </div>

    <p>鼠标悬停在按钮上应该改变颜色，但按钮应该保持水平排列</p>
</body>

</html>
