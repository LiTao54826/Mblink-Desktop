<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>EXE Icon Test</title>
    <style>
        body {
            background: #1e1e2e;
            color: #cdd6f4;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            gap: 24px;
        }
        h1 {
            font-size: 20px;
            margin: 0;
        }
        .icon-row {
            display: flex;
            gap: 32px;
            align-items: center;
        }
        .icon-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            background: #313244;
            border-radius: 12px;
            padding: 20px;
        }
        .icon-box img {
            border: 1px solid #585b70;
            border-radius: 4px;
            background: #45475a;
        }
        .label {
            font-size: 13px;
            color: #a6adc8;
        }
        #status {
            font-size: 14px;
            color: #a6e3a1;
        }
    </style>
</head>
<body>
    <h1>EXE Icon Loading Test</h1>
    <div class="icon-row">
        <div class="icon-box">
            <img src="./exe.ico" width="32" height="32" id="icon32">
            <span class="label">32x32</span>
        </div>
        <div class="icon-box">
            <img src="./exe.ico" width="64" height="64" id="icon64">
            <span class="label">64x64</span>
        </div>
        <div class="icon-box">
            <img src="./exe.ico" width="128" height="128" id="icon128">
            <span class="label">128x128</span>
        </div>
    </div>
    <div id="status">Loading...</div>
    <script>
        const img = document.getElementById('icon64');
        if (img) {
            img.onload = function() {
                const el = document.getElementById('status');
                if (el) el.textContent = 'Icon loaded: ' + img.naturalWidth + 'x' + img.naturalHeight;
            };
            img.onerror = function() {
                const el = document.getElementById('status');
                if (el) {
                    el.textContent = 'Failed to load icon';
                    el.style.color = '#f38ba8';
                }
            };
        }
    </script>
</body>
</html>
