<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>纯 Transform 动画测试</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #f0f0f0;
            font-family: sans-serif;
        }
        
        h1 { color: #333; }
        
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            padding: 20px;
        }
        
        .box {
            width: 100px;
            height: 100px;
            background: #3498db;
            border-radius: 8px;
            /* 关键：will-change 提示浏览器提升为独立层 */
            will-change: transform;
        }
        
        /* 只用 transform 动画 */
        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        
        .spin {
            animation: spin 2s linear infinite;
        }
        
        .stats {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: #0f0;
            padding: 10px;
            font-family: monospace;
            font-size: 14px;
            border-radius: 5px;
            z-index: 1000;
        }
        
        .info {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="stats" id="stats">
        FPS: --<br>
        Frame Time: -- ms
    </div>

    <h1>纯 Transform 动画测试</h1>
    
    <div class="info">
        <p><strong>测试说明：</strong></p>
        <ul>
            <li>只使用 transform: rotate() 动画</li>
            <li>所有元素都有 will-change: transform</li>
            <li>理论上 GPU 占用应该很低（< 5%）</li>
            <li>打开 Chrome DevTools → Rendering → 勾选 "Paint flashing"</li>
            <li>如果没有绿色闪烁，说明没有重绘，只有 GPU 合成</li>
        </ul>
    </div>
    
    <div class="container">
        <div class="box spin"></div>
        <div class="box spin"></div>
        <div class="box spin"></div>
        <div class="box spin"></div>
    </div>

    <script>
        let frameCount = 0;
        let lastTime = performance.now();
        
        function updateStats() {
            frameCount++;
            const now = performance.now();
            const delta = now - lastTime;
            
            if (delta >= 1000) {
                const fps = Math.round(frameCount * 1000 / delta);
                const frameTime = (delta / frameCount).toFixed(2);
                frameCount = 0;
                lastTime = now;
                
                document.getElementById('stats').innerHTML = 
                    `FPS: ${fps}<br>Frame Time: ${frameTime} ms`;
            }
            
            requestAnimationFrame(updateStats);
        }
        
        requestAnimationFrame(updateStats);
        
        console.log('纯 Transform 动画测试');
        console.log('打开 DevTools → Rendering → Paint flashing 查看是否有重绘');
    </script>
</body>
</html>
