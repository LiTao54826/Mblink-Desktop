<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="swiftFeather" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF8008;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFC837;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow">
        <feDropShadow dx="2" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Shield/Outline Background -->
  <path d="M 50 10 L 90 30 V 60 C 90 85 50 95 50 95 C 50 95 10 85 10 60 V 30 Z" fill="#2d3436" opacity="0.1"/>

  <!-- The Feather/Arrow Shape -->
  <!-- A stylized quill pen nib combined with an upward arrow -->
  <path d="M 50 20 L 75 45 L 60 45 L 70 80 L 45 55 L 30 55 Z" fill="url(#swiftFeather)" filter="url(#shadow)"/>
  
  <!-- Circuit Line Details (Tech Aspect) -->
  <path d="M 50 20 L 50 45 M 60 45 L 65 60 M 45 55 L 40 70" stroke="#FFF" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>
