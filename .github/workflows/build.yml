name: Open Source Readiness

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-readiness:
    name: Repository readiness
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"

      - name: Validate public entry files
        shell: pwsh
        run: |
          $required = @(
            "README.md",
            "LICENSE",
            "SECURITY.md",
            "SUPPORT.md",
            "CODE_OF_CONDUCT.md",
            "docs/QUICKSTART.md",
            "docs/BUILD.md",
            "docs/CONTRIBUTING.md",
            "docs/RELEASE.md",
            "THIRD_PARTY_NOTICES.md",
            "examples/README.md",
            "third_party.lock.json",
            "scripts/code_structure_baseline.json",
            "scripts/check_dependency_lock.ps1",
            "scripts/check_binding_readiness.py",
            "scripts/check_code_structure_baseline.py",
            "scripts/check_skia_provenance.ps1",
            ".github/workflows/release-readiness.yml",
            ".github/PULL_REQUEST_TEMPLATE.md",
            ".github/ISSUE_TEMPLATE/bug_report.yml",
            ".github/ISSUE_TEMPLATE/feature_request.yml"
          )

          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing.Count -gt 0) {
            $missing | ForEach-Object { Write-Error "Missing required file: $_" }
            exit 1
          }

      - name: Parse PowerShell support scripts
        shell: pwsh
        run: |
          $scripts = @(
            "scripts/download_deps.ps1",
            "scripts/check_dependency_lock.ps1",
            "scripts/check_skia_provenance.ps1"
          )

          foreach ($path in $scripts) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $path,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null

            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${path}: $($_.Message)" }
              exit 1
            }
          }

          $script = Get-Content "scripts/download_deps.ps1" -Raw
          if ($script -match "Read-Host") {
            Write-Error "scripts/download_deps.ps1 must remain non-interactive."
            exit 1
          }
          if ($script -match "git config --global" -and $script -notmatch "ConfigureGlobalGitProxy") {
            Write-Error "Global Git proxy changes must stay behind -ConfigureGlobalGitProxy."
            exit 1
          }

      - name: Check dependency notice pins
        shell: pwsh
        run: |
          .\scripts\check_dependency_lock.ps1

      - name: Check code structure baseline
        run: python scripts/check_code_structure_baseline.py

      - name: Check binding readiness metadata
        run: python scripts/check_binding_readiness.py

      - name: Generate code structure report
        shell: pwsh
        run: |
          python scripts/check_code_structure.py *> code-structure-report.txt
          if ($LASTEXITCODE -ne 0) {
            Get-Content code-structure-report.txt
            Write-Warning "Code structure debt exists in the current source tree; see the report above."
            Write-Warning "This readiness workflow keeps it advisory until a baseline cleanup is planned."
            exit 0
          }
          Get-Content code-structure-report.txt

      - name: Upload code structure report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-structure-report
          path: code-structure-report.txt

      - name: Generate circular dependency report
        run: python scripts/check_circular_deps.py

      - name: Check Python binding syntax
        run: python -m py_compile bindings/python/mblink/_ffi.py bindings/python/mblink/app.py bindings/python/mblink/shared.py bindings/python/mblink/resources.py bindings/python/mblink/controls.py

      - name: Check Go unsupported no-cgo surface
        working-directory: bindings/go
        shell: pwsh
        run: |
          $env:CGO_ENABLED = "0"
          go test ./mblink

      - name: Explain native build gate
        shell: pwsh
        run: |
          Write-Host "This required CI gate checks repository hygiene and onboarding files."
          Write-Host "The full Windows native build and cgo Go binding run are release gates because they need prepared Skia libraries and a C toolchain."
          Write-Host "See docs/BUILD.md and docs/RELEASE.md for the current build command, binding parity checks, and Skia provenance gate."
