name: Bug report
description: Report a reproducible MBlink bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail for a Windows-first reproduction.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Tag, commit SHA, or branch you tested.
      placeholder: "commit SHA"
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Build/dependencies
        - mblink-ui-dev
        - esm_loader
        - Runtime/rendering/layout
        - Bindings
        - Examples/docs
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include exact commands, project path, and input files if possible.
      placeholder: |
        1. Run ...
        2. Open ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include logs, screenshots, snapshot output, or error text.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Windows version, compiler, CMake version, Skia preparation state, and relevant dependencies.
      placeholder: |
        Windows:
        MSVC:
        CMake:
        Skia:
        QuickJS/SDL prepared by:
    validations:
      required: true
